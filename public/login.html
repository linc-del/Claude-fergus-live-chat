<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Fergus Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="login-wrap">
      <form class="login-card" id="loginForm">
        <div class="login-bolt">⚡</div>
        <h1>Fergus Assistant</h1>
        <p class="login-sub">Linc Electrical — team access</p>
        <input
          id="username"
          type="text"
          placeholder="Your name"
          autocomplete="username"
          autocapitalize="off"
          autofocus
        />
        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        />
        <button type="submit">Sign in</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
    <script src="/login.js"></script>
  </body>
</html>
