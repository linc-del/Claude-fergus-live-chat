# -----------------------------------------------------------------------------
# 04 — RATES & RULES  (the engine the quote-builder runs on)
# -----------------------------------------------------------------------------
rates_and_rules:
  labour_ex_gst:
    electrician: 95            # standardised quoting rate (not individual pay — see people.team)
    apprentice: 75
    minimum_charge: 1 hour labour per electrician per visit

  flat_charges_ex_gst:
    mileage: 30
    sundries: 20
    certificate_of_compliance: 20

  materials_markup:
    floor: 1.67                # Cost x 1.67 minimum (67% floor). Replaced the old cost/0.6 rule (Jul 2026).
    bands:                     # % markup on cost
      cable_wire_per_m: 100–130%
      standard_accessories: 150–280%     # GPOs, switches, plates
      loose_consumables: 150–300%        # or use flat sundries line
      brand_visible_googleable: 70–90%   # e.g. downlights
      big_ticket_checkable: 67–80%       # switchboards, RCBOs, named gear
    fixed_price_items: Rangehood / heat pump / set appliances are FIXED price, not formula-based (see quote-builder skill for figures).

  gross_profit_target: 30–40%  # whole job (materials + labour). Flag any quote under 30% GP before it goes out.

  gst_handling: >
    Push clean ex-GST sell prices to Fergus. The Fergus API can't set the GST column, so GST is
    applied manually in the Fergus UI per line. NEVER gross up x1.15 AND apply the column — that
    double-charges. (Critical operational rule — see quote-builder skill.)

  quoting:
    line_item_style: "Supply & install [item] in [location]. Test & certify."   # pricing shown separately
    workmanship_guarantee: 12 months
    quote_validity: conflict   # due-date field says 60 days, footer text says 30 days — see open_questions

  payment_terms:
    trade_account: Invoices due 20th of the month following invoice date.
    domestic: Payment due on completion unless credit approved in writing.

  deposits:                    # decided 22 Jul 2026 from real Fergus invoice distribution
    under_500: No deposit — payment on completion.
    500_to_2000: Up to 50% deposit before work begins; balance on completion.
    over_2000: No deposit, but first progress claim due at commencement; min 3 staged claims to completion.
    clause_see: templates.deposit_clause   # exact wording ready to paste into Terms of Trade

  terms_of_trade_rules:        # from MASTER Terms of Trade (updated 1 Jan 2026, under review by Deirdre)
    fault_finding: Chargeable whether or not a fault is found or repaired.
    cancellation: Under 24h notice may incur charges (allocated labour, travel, admin, materials ordered, lost booking).
    retention_of_title: Materials remain Linc's property until paid in full.
    overdue_accounts: Interest + reasonable debt recovery/legal/enforcement costs may apply.

# -----------------------------------------------------------------------------
# 05 — PROCESSES & SOPs   (status: draft — Lincoln/Toni to confirm & fill gaps)
# -----------------------------------------------------------------------------
processes:
  how_we_quote:                # draft
    - Enquiry in (phone, email, or channel like Tapi for PM work).
    - Site look / scope confirmed.
    - Cost materials from live Fergus pricebooks; apply markup rules; check whole job vs 30–40% GP target.
    - Write up in Fergus as Quote/Estimate using standard line format + intro + terms.
    - Send to customer.
    - "needs_human: follow-up cadence if no reply (template ready — see templates.quote_follow_up)."
  job_start_to_finish:         # draft
    - Quote/Estimate accepted -> job goes Active in Fergus.
    - Scheduled and worked (Fergus job phases).
    - "needs_human: end-of-job steps (photos, CoC, ask for review)."
    - Finalised in Fergus, invoiced through to Xero.
    - Payment chased per payment_terms.
  job_completion_checklist: needs_human   # photos? CoC/ESC lodged? site tidy? customer signed off?
  end_of_job_process: needs_human         # photos, CoC, invoice, review request
  ordering_process: needs_human           # how materials get from supplier (mainly Ideal, acct 463085) onto a Fergus job

# -----------------------------------------------------------------------------
# 06 — TEMPLATES & WORDING
# -----------------------------------------------------------------------------
templates:
  quote_intro: |            # confirmed — pulled from live quotes, kept as-is
    Thank you for the opportunity to price the work on your property.

    Our mission is to make every customer a repeat customer. As part of our service all quoted
    work comes with a 12 month workmanship guarantee. Customer service is everything to us and
    we have the systems in place so that we deliver on our promises.

    We have provided you with our best value price based on the information we have, we are
    always open to a conversation on our quoted amount, please call or email the office if you
    have any queries about this price.

  quote_follow_up: |        # draft — matches quote-intro tone, edit freely
    Kia ora [Name], just following up on the quote we sent through on [date] for [job]. Happy to
    talk through any part of it or adjust the scope if needed — give the office a call on
    027 3636190 or reply to this email. The quote's valid for 60 days from when it was sent.
    Cheers, [Name] / Linc Electrical

  review_request: |         # draft — add your Google review link
    Kia ora [Name], glad we could get that sorted for you. If you've got a minute, a quick
    Google review would mean a lot and helps other people in [Manawatū/Palmerston North] find
    us. [review link]. Thanks again for choosing Linc Electrical. Cheers, [Name]

  deposit_clause: |         # ready to paste into MASTER Terms of Trade (near payment terms)
    Deposits and progress payments
    For jobs under $500, no deposit is required — payment is due on completion, as set out above.
    For jobs between $500 and $2,000, we may require a deposit of up to 50% of the estimated
    price before work begins, with the balance payable on completion.
    For larger jobs and contract works over $2,000, we do not require a deposit, but the first
    progress claim is due at commencement of work, to cover materials ordered and scheduling
    committed on your behalf. Further progress claims will be invoiced at agreed milestones as
    the work proceeds (a minimum of three stages), with a final claim due on completion.
    We may vary these amounts or stages where a job involves unusual material cost,
    custom-ordered items, or an extended lead time, and will confirm this with you in writing
    before work begins.

  terms_of_trade_master: https://docs.google.com/document/d/1V0m1GSJcGeAZwjP_2UffRnz3Sc7d-6GwBE0-yCcaPDk

  needs_human: [overdue_invoice_nudge, booking_confirmation, sms_templates]

